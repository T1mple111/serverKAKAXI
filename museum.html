<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KAKAXI museum</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: rgb(255, 255, 255);
        }

        .header {
            width: 100%;
            background: #1c1c1c;
            padding: 30px;
            text-align: center;
            position: fixed;
            top: 0;
            color: rgb(255, 0, 234);
            left: 0;
            box-shadow: 0 2px 5px rgba(92, 24, 77, 0.5);
            z-index: 1000; 
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header button {
            margin-top: 25px;
            padding: 12px 35px;
            font-size: 15px;
            border: none;
            color: rgb(0, 0, 0);
            border-radius: 10px;
            background: rgb(255, 255, 255);
            cursor: pointer;
            transition: background 0.2s;
            margin: 10px;
        }
        .header button:hover {
            background: rgb(114, 114, 114);
        }
        .card {
            width: 400px;
            background: #1c1c1c;
            padding: 25px;
            border-radius: 15px;
            text-align: center;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: rgb(255, 0, 0);
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: rgb(160, 44, 44);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>KAKAXI</h1>
        <a href="menu.html">
            <button>На главную</button>
        </a>

    </div>

    <div class="card">
        <h2>Добро пожаловать на сервер Каках!</h2>
        <p>Тут будет информация...</p>
        <button>Зарегистрироваться</button>
    </div>

</body>
</html>
